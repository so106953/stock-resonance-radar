services:
  - type: web
    name: stock-resonance-data
    runtime: python
    plan: free
    rootDir: python-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ALLOWED_ORIGINS
        value: https://stock-resonance-radar.chuckzhu.chatgpt.site
